name = "leer-es-pensar"
compatibility_date = "2026-11-20"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "leer-es-pensar-books"

# Sustituye este id por el del namespace KV real cuando lo crees en Cloudflare.
# Mientras el binding no exista, el límite de intentos de login se omite.
[[kv_namespaces]]
binding = "LOGIN_RL"
id = "00000000000000000000000000000000"
